name: Bug or performance regression
description: Report a reproducible extension issue without private data.
body:
  - type: markdown
    attributes:
      value: "Do not upload tokens, weights, private prompts/references or raw histories. This is an unofficial local integration."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, GPU/VRAM, RAM, Python/PyTorch/CUDA, ComfyUI commit and extension commit.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Workflow, public minimal prompt, LoRA mode, FFN chunk, activation and optional modulation setting.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: Full request timing, cache hits, warm/fresh process, repetitions, errors and sanitized summaries. Distinguish microbenchmarks from video generation.
  - type: checkboxes
    id: privacy
    attributes:
      label: Review
      options:
        - label: I removed credentials, private prompts/references and machine-private paths.
          required: true
